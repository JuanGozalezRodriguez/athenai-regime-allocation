[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athenai"
version = "0.1.0"
description = "Detección difusa de régimen de mercado y asignación de capital con RL, explicable (reto AthenAI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando" }]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# El experimento cuántico usa solo las primitivas de referencia de Qiskit
# (statevector), NO requiere qiskit-aer.
quantum = ["qiskit>=1.0,<2.0"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
